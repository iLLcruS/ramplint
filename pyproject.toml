[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "ramplint"
dynamic = ["version"]
description = "Accessibility (WCAG) linter for Django and Jinja2 templates"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vladyslav Rostovskyi", email = "rostovskii.1020@gmail.com" }]
keywords = ["accessibility", "a11y", "wcag", "django", "jinja2", "templates", "linter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]
dependencies = ["tomli>=1.1; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6", "jsonschema>=4"]

[project.scripts]
ramplint = "ramplint.cli:main"

[project.urls]
Homepage = "https://github.com/iLLcruS/ramplint"
Issues = "https://github.com/iLLcruS/ramplint/issues"
Changelog = "https://github.com/iLLcruS/ramplint/blob/main/CHANGELOG.md"
Funding = "https://ko-fi.com/innerexcept"

[tool.hatch.version]
path = "src/ramplint/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ramplint"]

# Ship the rule documentation inside the package for `ramplint --explain`.
[tool.hatch.build.targets.wheel.force-include]
"docs/rules" = "ramplint/rule_docs"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["ramplint"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ramplint"]
