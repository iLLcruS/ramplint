[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "ramplint"
dynamic = ["version"]
description = "Accessibility (WCAG) linter for Django and Jinja2 templates"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Small-Business-1.0.0 OR PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "LICENSES/*.md"]
authors = [{ name = "Vladyslav Rostovskyi", email = "rostovskii.1020@gmail.com" }]
keywords = [
    "accessibility", "a11y", "wcag", "aria", "screen-reader", "django", "jinja2",
    "templates", "linter", "pre-commit", "django-templates", "jinja", "django-forms",
    "playwright", "browser",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]
dependencies = ["tomli>=1.1; python_version < '3.11'"]

[project.optional-dependencies]
# greenlet: coverage follows Playwright's greenlets (see [tool.coverage.run]).
# django and jinja2: the demo project and the template source map loader are tested.
dev = [
    "pytest>=7", "pytest-cov>=4", "ruff>=0.6", "jsonschema>=4", "greenlet>=3",
    "django>=4.2", "jinja2>=3",
]
# Browser scan mode (ramplint https://...). Also run: playwright install chromium
browser = ["playwright>=1.45"]

[project.scripts]
ramplint = "ramplint.cli:main"

[project.urls]
Homepage = "https://github.com/iLLcruS/ramplint"
Issues = "https://github.com/iLLcruS/ramplint/issues"
Changelog = "https://github.com/iLLcruS/ramplint/blob/main/CHANGELOG.md"
Funding = "https://ko-fi.com/innerexcept"

[tool.hatch.version]
path = "src/ramplint/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ramplint"]

# Ship the rule documentation inside the package for `ramplint --explain`.
[tool.hatch.build.targets.wheel.force-include]
"docs/rules" = "ramplint/rule_docs"

[tool.hatch.build.targets.sdist]
include = [
    "src", "tests", "examples", "docs", "README.md", "CHANGELOG.md", "COMMERCIAL.md",
    "LICENSE", "LICENSES",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "browser: needs Playwright and Chromium (pip install -e .[browser]; playwright install chromium)",
]

[tool.coverage.run]
source = ["ramplint"]
branch = true
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"
# Fixture projects imitate user code (third-party imports ruff cannot sort).
extend-exclude = ["tests/projects"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ramplint"]
