{% extends "base.html" %}
{% load i18n %}

{% block content %}
<h1>{% trans "Sign in" %}</h1>
<p id="login-help">{% trans "Use your work email to sign in." %}</p>

<form method="post" class="login-form">
  {% csrf_token %}
  <input type="text" name="username" placeholder="{% trans 'Username' %}">
  <input type="password" name="password" placeholder="{% trans 'Password' %}">

  <select name="language">
    <option value="en">English</option>
    <option value="ro">Română</option>
  </select>

  <input type="button" class="show-password">
  <button type="submit"><i class="icon icon-arrow-right"></i></button>
</form>
<p id="login-help"><a href="{% url 'accounts:reset' %}">{% trans "Forgot your password?" %}</a></p>
{% endblock %}
