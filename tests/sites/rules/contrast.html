<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Contrast</title>
<style>
  body { background: #fff; color: #222; font: 16px sans-serif; }
  .low { color: #aaa; }
  .large { color: #949494; font-size: 24px; }
  .glass { background: rgba(0, 0, 0, 0.5); color: #222; }
  .hero { background-image: linear-gradient(#000, #333); color: #eee; }
  .faded { color: #222; opacity: 0.3; }
</style></head>
<body><main>
  <h1>Contrast</h1>
  <p id="good">Dark text on white is fine.</p>
  <p id="low" class="low">Light grey text is hard to read.</p>
  <p id="large" class="large">Large text needs only 3:1.</p>
  <div class="glass"><span id="glass">Dark text on a half-black background.</span></div>
  <div class="hero"><p id="hero">Text over a gradient.</p></div>
  <p id="faded" class="faded">Faded with opacity.</p>
  <button id="off" disabled class="low">Disabled</button>
</main></body></html>
