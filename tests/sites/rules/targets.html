<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Targets</title>

  body { font: 16px sans-serif; }

  .icons { display: flex; gap: 2px; }
  .spaced { margin: 40px; }
  .big { width: 44px; height: 44px; }
</style></head>
<body><main>
  <h1>Targets</h1>
  <div class="icons">

  </div>
  <div class="spaced"><button class="tiny" id="alone" aria-label="Close"></button></div>
  <p>Read the <a href="/terms/" id="inline">terms</a> before you buy.</p>
  <label><input type="checkbox" id="agree"> I agree</label>
  <button class="big" id="big">Buy</button>
